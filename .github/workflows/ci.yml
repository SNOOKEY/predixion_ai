name: CI Pipeline - Quality, Security & Container Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # Stage 1: Code Quality, Linting, & Unit/Integration Tests
  # =========================================================================
  code-quality-and-test:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-cov

      - name: Check Code Quality & Formatting (Ruff)
        run: |
          ruff check .
          ruff format --check . || true

      - name: Run Unit & Resilience Tests with Coverage
        run: |
          pytest --cov=inference_service --cov=mock_dependency --cov-report=term-missing tests/

  # =========================================================================
  # Stage 2: Security & Vulnerability Sniffing (SAST, SCA, Secret Detection)
  # =========================================================================
  vulnerability-security-scan:
    name: Vulnerability & Security Sniffing
    runs-on: ubuntu-latest
    needs: [code-quality-and-test]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: Sniff Software Composition Vulnerabilities (SCA via pip-audit)
        run: |
          pip-audit -r requirements.txt

      - name: Sniff Static Code Vulnerabilities (SAST via Bandit)
        run: |
          bandit -r inference_service mock_dependency -ll

      - name: Sniff Leaked Credentials & Secrets (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          extra_args: --only-verified

      - name: Run SonarQube Static Analysis (Cloud Runner)
        uses: SonarSource/sonarqube-scan-action@v5
        if: env.SONAR_TOKEN != ''
        continue-on-error: true

  # =========================================================================
  # Stage 3: Container Image Build & Image CVE Sniffing
  # =========================================================================
  container-image-build:
    name: Container Image Build & Image Scan
    runs-on: ubuntu-latest
    needs: [code-quality-and-test, vulnerability-security-scan]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: |
            predixion-ai:latest
            predixion-ai:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sniff Container Image Vulnerabilities (Aqua Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "predixion-ai:latest"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Container Smoke Test (Health Endpoint Check)
        run: |
          docker run -d --name test-inference -p 8000:8000 predixion-ai:latest
          sleep 5
          curl --fail --retry 5 --retry-delay 2 http://localhost:8000/health || (docker logs test-inference && exit 1)
          docker stop test-inference && docker rm test-inference
