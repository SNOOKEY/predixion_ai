name: CI Pipeline - Quality, Security & Container Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # Stage 1: Code Quality, Linting, & Unit/Integration Tests
  # =========================================================================
  code-quality-and-test:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-cov

      - name: Check Code Quality & Formatting (Ruff)
        run: |
          ruff check .
          ruff format --check . || true

      - name: Run Unit & Resilience Tests with Coverage
        run: |
          pytest --cov=inference_service --cov=mock_dependency --cov-report=term-missing tests/

  # =========================================================================
  # Stage 2: Security & Vulnerability Sniffing (SAST, SCA, Secret Detection)
  # =========================================================================
  vulnerability-security-scan:
    name: Vulnerability & Security Sniffing
    runs-on: ubuntu-latest
    needs: [code-quality-and-test]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: Sniff Software Composition Vulnerabilities (SCA via pip-audit)
        run: |
          pip-audit -r requirements.txt

      - name: Sniff Static Code Vulnerabilities (SAST via Bandit)
        run: |
          bandit -r inference_service mock_dependency -ll

      - name: Sniff Leaked Credentials & Secrets (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          extra_args: --only-verified

  # =========================================================================
  # Stage 3: SonarQube Quality Gate & Static Analysis
  # =========================================================================
  sonarqube-analysis:
    name: SonarQube Analysis & Quality Gate
    runs-on: ubuntu-latest
    needs: [code-quality-and-test, vulnerability-security-scan]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run SonarQube Scanner
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        continue-on-error: true

      - name: SonarQube Status Summary
        run: |
          echo "========================================================================"
          echo "SonarQube Stage Active in CI Pipeline"
          if [ -n "$SONAR_TOKEN" ]; then
            echo "[OK] SonarQube scan dispatched with provided SONAR_TOKEN."
          else
            echo "[INFO] SonarQube token not configured in GitHub Secrets."
            echo "       To bind your SonarCloud or SonarQube server, add SONAR_TOKEN"
            echo "       (and optionally SONAR_HOST_URL) under Repository -> Settings -> Secrets."
          fi
          echo "========================================================================"

  # =========================================================================
  # Stage 4: Container Image Build & Image CVE Sniffing
  # =========================================================================
  container-image-build:
    name: Container Image Build & Image Scan
    runs-on: ubuntu-latest
    needs: [code-quality-and-test, vulnerability-security-scan, sonarqube-analysis]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: |
            predixion-ai:1.0
            predixion-ai:1.0.${{ github.run_number }}
            predixion-ai:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sniff Container Image Vulnerabilities (Aqua Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "predixion-ai:1.0"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Container Smoke Test (Health Endpoint Check)
        run: |
          docker run -d --name test-inference -p 8000:8000 predixion-ai:1.0
          sleep 5
          curl --fail --retry 5 --retry-delay 2 http://localhost:8000/health || (docker logs test-inference && exit 1)
          docker stop test-inference && docker rm test-inference

      # =========================================================================
      # Push Scanned & Verified Image to Amazon ECR (on main branch push)
      # =========================================================================
      - name: Configure AWS Credentials
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.AWS_ACCESS_KEY_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Log in to Amazon ECR
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.AWS_ACCESS_KEY_ID != ''
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and Push Existing Docker Image to ECR
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.AWS_ACCESS_KEY_ID != ''
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          echo "Tagging and pushing existing verified image to ${REGISTRY}/predixion-inference-service..."
          
          docker tag predixion-ai:1.0 "${REGISTRY}/predixion-inference-service:1.0"
          docker tag predixion-ai:1.0 "${REGISTRY}/predixion-inference-service:1.0.${{ github.run_number }}"
          docker tag predixion-ai:1.0 "${REGISTRY}/predixion-inference-service:${{ github.sha }}"

          docker push "${REGISTRY}/predixion-inference-service:1.0"
          docker push "${REGISTRY}/predixion-inference-service:1.0.${{ github.run_number }}"
          docker push "${REGISTRY}/predixion-inference-service:${{ github.sha }}"
          echo "[OK] Successfully pushed image tags to Amazon ECR."

      - name: ECR Push Notice
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.AWS_ACCESS_KEY_ID == ''
        run: |
          echo "========================================================================"
          echo "[NOTICE] AWS_ACCESS_KEY_ID secret not found in repository secrets."
          echo "         The Docker image was successfully built, scanned, and verified."
          echo "         To push to Amazon ECR automatically on merge, add:"
          echo "         - AWS_ACCESS_KEY_ID"
          echo "         - AWS_SECRET_ACCESS_KEY"
          echo "         under Settings -> Secrets and variables -> Actions."
          echo "========================================================================"




